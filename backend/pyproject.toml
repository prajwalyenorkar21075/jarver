[project]
name = "jarvis-backend"
version = "0.1.0"
description = "J.A.R.V.I.S. — AI + Robotics Platform Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "uvicorn[standard]>=0.54.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "ultralytics>=8.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
    "aiofiles>=23.0.0",
    "cadquery>=2.5.0",
    "trimesh>=5.0.0",
    "SQLAlchemy>=2.0.0",
    "playwright>=1.40.0",
    "pocket-tts>=1.0.1",
    'tomli>=2.0.0; python_version < "3.11"',
]

[project.optional-dependencies]
documents = [
    "pytesseract>=0.3.10",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "soundfile>=0.12.1",
]
embeddings = [
    "sentence-transformers>=2.5.0",
]
robotics = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.1.0",
    "roboticstoolbox-python>=1.0.0",
]
hardware = [
    "pyrealsense2>=2.54.0",
    "pycuda>=2023.1",
    "tensorrt>=8.6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
